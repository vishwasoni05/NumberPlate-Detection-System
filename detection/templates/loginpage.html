<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login and Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #2d3748;
        }

        .container {
            width: 400px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .tabs {
            display: flex;
            cursor: pointer;
            justify-content: space-around;
            background: #4f46e5;
            padding: 5px;
            margin: 15px;
            border-radius: 12px;
        }

        .tabs div {
            flex: 1;
            text-align: center;
            padding: 12px;
            color: #fff;
            font-weight: 600;
            transition: all 0.3s ease;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tabs div.active {
            background: #fff;
            color: #4f46e5;
        }

        .form {
            padding: 20px 30px;
            display: none;
        }

        .form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #4a5568;
        }

        .form-group input {
            width: 100%;
            padding: 12px 40px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: #4f46e5;
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .form-group i {
            position: absolute;
            left: 12px;
            top: 38px;
            color: #a0aec0;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            background: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        .form-group input::placeholder {
            color: #a0aec0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form.active {
            animation: fadeIn 0.5s ease forwards;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <div id="loginTab" class="active">
            <i class="fas fa-sign-in-alt"></i> Login
        </div>
        <div id="registerTab">
            <i class="fas fa-user-plus"></i> Register
        </div>
    </div>

    <form id="loginForm" class="form active">
        <div class="form-group">
            <label for="loginUsername">Username</label>
            <i class="fas fa-user"></i>
            <input type="text" id="loginUsername" placeholder="Enter your username">
        </div>
        <div class="form-group">
            <label for="loginPassword">Password</label>
            <i class="fas fa-lock"></i>
            <input type="password" id="loginPassword" placeholder="Enter your password">
        </div>
        <button type="submit" class="btn">Login</button>
    </form>

    <form id="registerForm" class="form">
        <div class="form-group">
            <label for="registerName">Name</label>
            <i class="fas fa-user"></i>
            <input type="text" id="registerName" placeholder="Enter your name">
        </div>
        <div class="form-group">
            <label for="registerEmail">Email</label>
            <i class="fas fa-envelope"></i>
            <input type="email" id="registerEmail" placeholder="Enter your email">
        </div>
        <div class="form-group">
            <label for="registerPassword">Password</label>
            <i class="fas fa-lock"></i>
            <input type="password" id="registerPassword" placeholder="Enter your password">
        </div>
        <div class="form-group">
            <label for="registerContact">Contact Number</label>
            <i class="fas fa-phone"></i>
            <input type="text" id="registerContact" placeholder="Enter your contact number">
        </div>
        <button type="submit" class="btn">Register</button>
    </form>
</div>

<script>
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');

    loginTab.addEventListener('click', () => {
        loginTab.classList.add('active');
        registerTab.classList.remove('active');
        loginForm.classList.add('active');
        registerForm.classList.remove('active');
    });

    registerTab.addEventListener('click', () => {
        registerTab.classList.add('active');
        loginTab.classList.remove('active');
        registerForm.classList.add('active');
        loginForm.classList.remove('active');
    });
</script>

</body>
</html>
